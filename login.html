<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
      background-color: #f2f2f2;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 80%;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
    }

    button:hover {
      background-color: #1976D2;
    }
  </style>
</head>
<body>

  <h2>Enter Your Name</h2>
  <input type="text" id="username" placeholder="Type your name here" />
  <br>
  <button onclick="sendName()">Submit</button>

  <script>
    function sendName() {
      var name = document.getElementById("username").value;
      if (name.trim() !== "") {
        Android.getUser(name); // This is the method from Sketchware
      } else {
        alert("Please enter your name.");
      }
    }
  </script>

</body>
</html>
